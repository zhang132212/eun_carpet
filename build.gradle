plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	flatDir {
		dirs 'libs'
	}
	maven {
		url = "https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1"
	}
	maven { url 'https://maven.aliyun.com/repository/public' }
	maven {
		url = "https://maven.shedaniel.me/"
	}

}

loom {
	splitEnvironmentSourceSets()

	runs {
		client {
			vmArgs "-Ddevauth.enabled=true"
		}
	}

	mods {
		"${mod_id}" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	runtimeOnly("me.djtheredstoner:DevAuth-fabric:1.2.2")
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation files("libs/fabric-carpet-26.2+v260616.jar")
	implementation 'org.jetbrains:annotations:24.0.1'
	compileOnly 'org.jetbrains:annotations:24.0.1'
	implementation "me.shedaniel.cloth:cloth-config-fabric:26.2.155"
}

processResources {
	inputs.property "version", project.version
	inputs.property "mod_id", project.mod_id
	inputs.property "mod_name", project.mod_name
	inputs.property "mod_homepage", project.mod_homepage
	inputs.property "mod_sources", project.mod_sources
	inputs.property "minecraft_dependency", project.minecraft_dependency
	inputs.property "minecraft_version_id", project.minecraft_version_id
	inputs.property "minecraft_version", project.minecraft_version
	inputs.property "loader_version", project.loader_version
	inputs.property "fabric_api_version", project.fabric_api_version

	filesMatching("fabric.mod.json") {
		expand project.properties
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName
	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}
